<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="関西の終電が消えていく様子を時間で可視化する地図。出発駅を選ぶと、各駅へ帰れる最終出発時刻がわかります。" />
    <title>関西終電図 — KANSAI LAST TRAIN ATLAS</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Ccircle cx=%228%22 cy=%228%22 r=%226%22 fill=%22%23ffd166%22/%3E%3C/svg%3E" />
    <script type="module" crossorigin src="./assets/index-ntdHbOne.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/network-YXJz_vGy.js">
    <link rel="stylesheet" crossorigin href="./assets/index-D9cJQUVv.css">
  </head>
  <body>
    <header class="top">
      <div class="brand">
        <h1>関西終電図</h1>
        <span class="sub">KANSAI LAST TRAIN ATLAS</span>
      </div>
      <div class="clock" id="clock" aria-live="polite">--:--</div>
    </header>

    <div id="notice" class="notice" role="note"></div>

    <main id="stage">
      <svg id="map" role="img" aria-label="路線図"></svg>
      <div id="view3d" class="view3d" hidden></div>
      <div class="viewmode" role="group" aria-label="表示">
        <button data-mode="3d" aria-pressed="true">3D</button>
        <button data-mode="2d" aria-pressed="false">平面</button>
      </div>
      <p id="hint3d" class="hint3d" hidden>高さ = 時刻。柱の高さはその駅の最終発車（出発駅を選ぶと、その駅へ帰れる最終出発時刻）。ドラッグで回転、右ドラッグで移動、ホイールで拡大。</p>
      <div class="zoom" id="zoom">
        <button id="zoomIn" aria-label="拡大">＋</button>
        <button id="zoomOut" aria-label="縮小">－</button>
        <button id="zoomReset" aria-label="全体表示">⤢</button>
      </div>
      <div id="tooltip" class="tooltip" hidden></div>
    </main>

    <aside class="panel" id="panel">
      <section>
        <label class="field">
          <span>出発駅</span>
          <input id="originInput" list="stationList" placeholder="駅名を入力（例: 梅田）" autocomplete="off" />
          <datalist id="stationList"></datalist>
        </label>
        <p id="originSummary" class="summary">駅を選ぶと、各駅へ帰れる最終出発時刻を表示します。地図上の駅をタップしても選べます。</p>
      </section>
      <section id="stationInfo" hidden></section>
      <section>
        <h2>レイヤー</h2>
        <div id="layers" class="layers"></div>
      </section>
      <footer class="fine">
        駅座標: <a href="https://github.com/adieuadieu/japan-train-data" target="_blank" rel="noopener">japan-train-data</a> (MIT)。
        背景地図: 地球地図日本（国土地理院）を加工して作成（<a href="https://github.com/biskwikman/jpn-atlas" target="_blank" rel="noopener">jpn-atlas</a> 経由）。
        ダイヤ改正・遅延・臨時列車は反映されません。お出かけ前に各社の公式時刻表をご確認ください。
      </footer>
    </aside>

    <footer class="timebar">
      <button id="play" aria-label="再生">▶</button>
      <input id="time" type="range" step="1" aria-label="時刻" />
      <select id="speed" aria-label="再生速度">
        <option value="1">×1</option>
        <option value="3" selected>×3</option>
        <option value="10">×10</option>
      </select>
      <button id="now" title="現在時刻">今</button>
    </footer>

  </body>
</html>
