<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>東建多度カントリークラブ・名古屋 1番ホール 3D（__VERSION__）</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9cc3e6;font-family:"Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;}
  #c{display:block;width:100%;height:100%;touch-action:none;}
  .panel{position:absolute;background:rgba(18,28,22,.78);color:#eef4ec;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;box-shadow:0 2px 10px rgba(0,0,0,.25);}
  #ui{left:10px;top:10px;width:250px;max-height:calc(100% - 40px);overflow:auto;}
  #ui h1{font-size:14px;margin:0 0 6px;font-weight:700;}
  #ui h2{font-size:12px;margin:10px 0 4px;color:#b9d7b0;font-weight:600;letter-spacing:.05em;}
  button{background:#2f5a3a;color:#fff;border:1px solid #4d8a5c;border-radius:6px;padding:5px 7px;margin:2px 0;font-size:12px;cursor:pointer;width:100%;text-align:left;}
  button:hover{background:#3d7249;} button.on{background:#c98a1d;border-color:#e7b04d;}
  .row{display:flex;gap:4px;} .row button{flex:1;text-align:center;}
  label{display:block;cursor:pointer;margin:2px 0;} select,input[type=range]{width:100%;}
  #info{right:10px;top:10px;width:230px;}
  #info table{border-collapse:collapse;width:100%;} #info td{padding:2px 4px;border-bottom:1px solid rgba(255,255,255,.12);}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle;border:1px solid #fff8;}
  #measure{left:50%;transform:translateX(-50%);bottom:34px;display:none;text-align:center;font-size:14px;}
  #credit{right:0;bottom:0;border-radius:8px 0 0 0;font-size:11px;padding:4px 8px;max-width:70%;}
  #fps{left:10px;bottom:6px;font-size:11px;padding:3px 6px;}
  #flyHud{left:50%;top:10px;transform:translateX(-50%);display:none;text-align:center;font-size:13px;min-width:300px;}
  #flyHud .help{font-size:11px;color:#c9d6c5;margin-top:4px;}
  #joy{position:absolute;left:24px;bottom:40px;width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.14);border:2px solid rgba(255,255,255,.45);display:none;touch-action:none;}
  #joyKnob{position:absolute;left:40px;top:40px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.55);}
  #flyBtns{position:absolute;right:24px;bottom:40px;display:none;flex-direction:column;gap:10px;}
  #flyBtns button{width:64px;height:52px;font-size:13px;text-align:center;touch-action:none;background:rgba(18,28,22,.75);}
  button.fly{background:#7a4d12;border-color:#d9973a;}
  #toggle{display:none;}
  #loading{left:50%;top:50%;transform:translate(-50%,-50%);font-size:15px;}
  .note{font-size:11px;color:#c9d6c5;}
  @media (max-width:700px){#ui{width:200px;font-size:12px}#info{width:180px;font-size:11px}}
</style>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading" class="panel">読み込み中…</div>
<div id="ui" class="panel">
  <h1>東建多度CC・名古屋 1番ホール</h1>
  <div class="note">__VERSION__</div>
  <h2>視点</h2>
  <button id="vTee">① ティーから見た景色</button>
  <button id="vTop">② 真上（レイアウト確認）</button>
  <button id="vFly">③ フライオーバー（約15秒）</button>
  <button id="vBack">④ グリーン奥から振り返り</button>
  <button id="vFree" class="fly">⑤ 自由飛行モード：OFF</button>
  <label>ティー選択（①で使用）
    <select id="teeSel"></select></label>
  <h2>表示</h2>
  <label><input type="checkbox" id="tTees" checked> ティー位置（色別）</label>
  <label><input type="checkbox" id="tYards" checked> ヤード表示</label>
  <label><input type="checkbox" id="tInfo" checked> ホール情報パネル</label>
  <label><input type="checkbox" id="tAer"> 航空写真を重ねる（照合用）</label>
  <h2>距離計測</h2>
  <button id="mBtn">2点クリックで計測：OFF</button>
  <h2>時刻（想定日 __DATE__）</h2>
  <input type="range" id="time" min="6" max="18" step="0.25" value="10"><div id="timeLbl" class="note"></div>
  <h2>画質</h2>
  <select id="quality"><option value="high">高</option><option value="std" selected>標準</option><option value="low">軽量</option></select>
  <div class="note" style="margin-top:6px">操作：左ドラッグ＝回転／右ドラッグ・2本指＝移動／ホイール・ピンチ＝ズーム</div>
</div>
<div id="info" class="panel"></div>
<div id="measure" class="panel"></div>
<div id="flyHud" class="panel"><div id="flyInfo"></div>
  <div class="help">PC：W/S 前後・A/D 左右・Space/E 上昇・Shift+Space/Q 下降・ドラッグで向き・ホイールで速さ・Shiftで加速・Escで終了<br>画面上：左下の円をドラッグで移動・右下のボタンで上下（マウス・タッチどちらでも可）</div></div>
<div id="joy"><div id="joyKnob"></div></div>
<div id="flyBtns"><button id="flyUp">▲ 上昇</button><button id="flyDown">▼ 下降</button></div>
<div id="fps" class="panel">-- fps</div>
<div id="credit" class="panel">__CREDIT__</div>
<script id="data" type="application/json">__DATA__</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';

const D = JSON.parse(document.getElementById('data').textContent);
const F = D.feat;
const $ = id => document.getElementById(id);

function b64u8(s){ const b = atob(s); const u = new Uint8Array(b.length); for (let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }

// ---------- height data ----------
const N = D.near; const nearU = new Uint16Array(b64u8(N.h).buffer);
const NX = N.nx, NZ = N.nz;
function nearRaw(i,j){ return N.base + nearU[j*NX+i]*0.01; }
function hNear(x,z){
  let fx = x - N.x0, fz = z - N.z0;
  fx = Math.min(Math.max(fx,0),NX-1.0001); fz = Math.min(Math.max(fz,0),NZ-1.0001);
  const i=Math.floor(fx), j=Math.floor(fz), tx=fx-i, tz=fz-j;
  const a=nearRaw(i,j), b=nearRaw(i+1,j), c=nearRaw(i,j+1), d=nearRaw(i+1,j+1);
  return (a*(1-tx)+b*tx)*(1-tz)+(c*(1-tx)+d*tx)*tz;
}
function grid16(G){ const u = new Int16Array(b64u8(G.h).buffer); return {n:G.n, ext:G.ext, res:G.res, v:u}; }
const MID = grid16(D.mid), FAR = grid16(D.far);
function hGrid(G,x,z){
  let fx=(x+G.ext)/G.res, fz=(z+G.ext)/G.res; const n=G.n;
  fx=Math.min(Math.max(fx,0),n-1.0001); fz=Math.min(Math.max(fz,0),n-1.0001);
  const i=Math.floor(fx), j=Math.floor(fz), tx=fx-i, tz=fz-j, v=G.v;
  const a=v[j*n+i]*0.1, b=v[j*n+i+1]*0.1, c=v[(j+1)*n+i]*0.1, d=v[(j+1)*n+i+1]*0.1;
  return (a*(1-tx)+b*tx)*(1-tz)+(c*(1-tx)+d*tx)*tz;
}
const inNear = (x,z,m=0) => x>N.x0+m && x<N.x0+NX-1-m && z>N.z0+m && z<N.z0+NZ-1-m;
function hAt(x,z){ return inNear(x,z) ? hNear(x,z) : hGrid(MID,x,z); }

// ---------- renderer / scene ----------
const canvas = $('c');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.62;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xc4d6e6, 0.000055);
const camera = new THREE.PerspectiveCamera(50, 1, 0.3, 150000);
const controls = new OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.maxPolarAngle = Math.PI*0.495;
controls.screenSpacePanning = false; controls.minDistance = 2; controls.maxDistance = 20000;

// sky
const sky = new Sky(); sky.scale.setScalar(120000); scene.add(sky);
const su = sky.material.uniforms;
// deepen the summer sky: Preetham output is very bright at high sun, so scale it and boost saturation
function deepenSky(mat){ mat.onBeforeCompile = sh => { sh.fragmentShader = sh.fragmentShader.replace('gl_FragColor = vec4( retColor, 1.0 );',
  'vec3 c = retColor*0.36; float l = dot(c, vec3(0.2126,0.7152,0.0722)); c = max(mix(vec3(l), c, 1.8), 0.0); gl_FragColor = vec4( c, 1.0 );'); }; }
deepenSky(sky.material);
su.turbidity.value = 2.2; su.rayleigh.value = 2.2; su.mieCoefficient.value = 0.004; su.mieDirectionalG.value = 0.8;
const sunDir = new THREE.Vector3();
const sun = new THREE.DirectionalLight(0xffffff, 3.2); sun.castShadow = true;
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.6;
const sc = sun.shadow.camera; sc.left=-480; sc.right=480; sc.top=480; sc.bottom=-480; sc.near=10; sc.far=3000;
scene.add(sun); scene.add(sun.target);
const hemi = new THREE.HemisphereLight(0xbcd7ff, 0x5a6b3a, 0.9); scene.add(hemi);
const pmrem = new THREE.PMREMGenerator(renderer);
let envRT = null;

function sunPosition(date, lat, lon){
  const rad=Math.PI/180, n = date.getTime()/86400000 + 2440587.5 - 2451545.0;
  const L=((280.460+0.9856474*n)%360+360)%360, g=(((357.528+0.9856003*n)%360+360)%360)*rad;
  const lam=(L+1.915*Math.sin(g)+0.020*Math.sin(2*g))*rad, eps=(23.439-0.0000004*n)*rad;
  const ra=Math.atan2(Math.cos(eps)*Math.sin(lam),Math.cos(lam)), dec=Math.asin(Math.sin(eps)*Math.sin(lam));
  const gmst=((18.697374558+24.06570982441908*n)%24+24)%24, ha=(gmst*15+lon)*rad-ra;
  const alt=Math.asin(Math.sin(lat*rad)*Math.sin(dec)+Math.cos(lat*rad)*Math.cos(dec)*Math.cos(ha));
  const az=Math.atan2(-Math.sin(ha), Math.tan(dec)*Math.cos(lat*rad)-Math.sin(lat*rad)*Math.cos(ha));
  return {alt, az};
}
function setTime(hours){
  const [Y,M,Dd] = D.info.date.split('-').map(Number);
  const utc = Date.UTC(Y, M-1, Dd, 0, 0, 0) + (hours-9)*3600000;   // JST = UTC+9
  const {alt, az} = sunPosition(new Date(utc), D.info.lat0, D.info.lon0);
  sunDir.set(Math.cos(alt)*Math.sin(az), Math.sin(alt), -Math.cos(alt)*Math.cos(az));
  su.sunPosition.value.copy(sunDir);
  const e = Math.max(sunDir.y, 0);
  sun.intensity = 3.4*Math.min(1, e*3.5);
  sun.color.setHSL(0.1, 0.55*(1-Math.min(1,e*2.2)), 0.5+0.5*Math.min(1,e*2.2));
  hemi.intensity = 0.35 + 0.75*Math.min(1, e*2.5);
  const hh = Math.floor(hours), mm = Math.round((hours-hh)*60);
  $('timeLbl').textContent = `${hh}:${String(mm).padStart(2,'0')}  太陽高度 ${(alt*180/Math.PI).toFixed(1)}°／方位 ${(((az*180/Math.PI)+360)%360).toFixed(1)}°`;
  // environment map from the sky (for water reflections)
  const skyScene = new THREE.Scene(); const s2 = new Sky(); s2.scale.setScalar(10000);
  for (const k of ['turbidity','rayleigh','mieCoefficient','mieDirectionalG']) s2.material.uniforms[k].value = su[k].value;
  s2.material.uniforms.sunPosition.value.copy(sunDir); deepenSky(s2.material); skyScene.add(s2);
  if (envRT) envRT.dispose(); envRT = pmrem.fromScene(skyScene);
  scene.environment = null; waterMats.forEach(m => { m.envMap = envRT.texture; m.needsUpdate = true; });
  updateShadowCam();
}
function updateShadowCam(){
  const c = new THREE.Vector3(controls.target.x, 80, controls.target.z);
  c.x = Math.max(-300, Math.min(300, c.x)); c.z = Math.max(-250, Math.min(250, c.z));
  sun.target.position.set(0, 80, 0);
  sun.position.copy(sun.target.position).addScaledVector(sunDir, 1500);
  sun.target.updateMatrixWorld();
}

// ---------- textures ----------
const tl = new THREE.TextureLoader();
function tex(uri, srgb){ const t = tl.load(uri); t.flipY=false; t.colorSpace = srgb?THREE.SRGBColorSpace:THREE.NoColorSpace;
  t.minFilter=THREE.LinearMipmapLinearFilter; t.magFilter=THREE.LinearFilter; t.anisotropy=8; t.wrapS=t.wrapT=THREE.ClampToEdgeWrapping; return t; }
const tM1 = tex(D.tex.m1,false), tM2 = tex(D.tex.m2,false), tM3 = tex(D.tex.m3,false), tAer = tex(D.tex.aer,true);
const tMid = tex(D.tex.mid,true), tFar = tex(D.tex.far,true);

// ---------- near terrain ----------
const uniforms = { tM1:{value:tM1}, tM2:{value:tM2}, tM3:{value:tM3}, tAer:{value:tAer}, uAer:{value:0} };
const HD = (()=>{ const a=D.feat.tees.FULL, b=D.feat.pin; const dx=b.x-a.x, dz=b.z-a.z, l=Math.hypot(dx,dz); return [dx/l, dz/l]; })();
const nearMat = new THREE.MeshStandardMaterial({roughness:0.93, metalness:0});
nearMat.onBeforeCompile = (sh) => {
  Object.assign(sh.uniforms, uniforms);
  sh.vertexShader = sh.vertexShader.replace('#include <common>', '#include <common>\nvarying vec3 vWP;')
    .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvWP = (modelMatrix*vec4(transformed,1.0)).xyz;');
  sh.fragmentShader = sh.fragmentShader.replace('#include <common>', `#include <common>
    varying vec3 vWP; uniform sampler2D tM1, tM2, tM3, tAer; uniform float uAer;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(127.1,311.7)))*43758.5453); }
    float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.0-2.0*f);
      return mix(mix(hash(i),hash(i+vec2(1,0)),f.x), mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x), f.y); }
    vec3 lin(vec3 c){ return pow(c, vec3(2.2)); }
    float ss(float m){ return smoothstep(0.38, 0.62, m); }`)
  .replace('#include <map_fragment>', `
    vec2 uv = (vWP.xz - vec2(${N.x0.toFixed(1)}, ${N.z0.toFixed(1)}) + 0.5) / vec2(${NX}.0, ${NZ}.0);
    vec3 m1 = texture2D(tM1, uv).rgb;   // r fairway, g green, b sand
    vec3 m2 = texture2D(tM2, uv).rgb;   // r water, g tee, b forest
    vec3 m3 = texture2D(tM3, uv).rgb;   // r path, g first cut, b collar
    float n1 = vnoise(vWP.xz*0.08), n2 = vnoise(vWP.xz*0.9), n3 = vnoise(vWP.xz*6.0);
    vec3 rough2 = lin(vec3(0.27,0.44,0.13)) * (0.85+0.3*n1) * (0.9+0.15*n3);
    vec3 rough1 = lin(vec3(0.32,0.54,0.15)) * (0.92+0.14*n1);
    vec3 fair   = lin(vec3(0.38,0.66,0.19)) * (0.94+0.1*n2);
    vec3 collar = lin(vec3(0.30,0.60,0.21));
    vec3 grn    = lin(vec3(0.33,0.68,0.22)) * (0.97+0.05*n2);
    vec3 teeC   = lin(vec3(0.31,0.60,0.22));
    vec3 sand   = lin(vec3(0.86,0.81,0.68)) * (0.95+0.08*n3);
    vec3 forest = lin(vec3(0.16,0.22,0.09)) * (0.8+0.4*n2);
    vec3 pathC  = lin(vec3(0.36,0.36,0.35)) * (0.95+0.08*n3);
    vec3 bed    = lin(vec3(0.20,0.22,0.14));
    vec2 hd = vec2(${HD[0].toFixed(5)}, ${HD[1].toFixed(5)}); vec2 pd = vec2(-hd.y, hd.x);
    float sF = smoothstep(0.46, 0.54, abs(fract(dot(vWP.xz, pd)/13.0)*2.0-1.0));
    float sG = smoothstep(0.44, 0.56, abs(fract(dot(vWP.xz, hd)/3.2)*2.0-1.0));
    float micro = vnoise(vWP.xz*22.0)*0.5 + vnoise(vWP.xz*55.0)*0.5;
    fair *= mix(0.86, 1.10, sF) * (0.95+0.08*micro);
    grn  *= mix(0.93, 1.06, sG) * (0.98+0.04*micro);
    teeC *= mix(0.94, 1.05, sG);
    rough2 *= 0.9+0.2*micro; rough1 *= 0.93+0.14*micro;
    vec3 col = rough2;
    col = mix(col, forest, ss(m2.b));
    col = mix(col, rough1, ss(m3.g));
    col = mix(col, fair,   ss(m1.r));
    col = mix(col, collar, ss(m3.b));
    col = mix(col, grn,    ss(m1.g));
    col = mix(col, teeC,   ss(m2.g));
    col = mix(col, sand,   ss(m1.b));
    col = mix(col, pathC,  ss(m3.r));
    col = mix(col, bed,    ss(m2.r));
    vec3 aer = texture2D(tAer, uv).rgb;
    col = mix(col, aer, uAer);
    diffuseColor.rgb = col;`);
};
let nearMesh = null;
function buildNear(step){
  if (nearMesh){ scene.remove(nearMesh); nearMesh.geometry.dispose(); }
  const nx = Math.floor((NX-1)/step)+1, nz = Math.floor((NZ-1)/step)+1;
  const pos = new Float32Array(nx*nz*3); let k=0;
  for (let j=0;j<nz;j++) for (let i=0;i<nx;i++){ const x=N.x0+i*step, z=N.z0+j*step;
    pos[k++]=x; pos[k++]=nearRaw(i*step, j*step); pos[k++]=z; }
  const idx = new Uint32Array((nx-1)*(nz-1)*6); k=0;
  for (let j=0;j<nz-1;j++) for (let i=0;i<nx-1;i++){ const a=j*nx+i, b=a+1, c=a+nx, d=c+1;
    idx[k++]=a; idx[k++]=c; idx[k++]=b; idx[k++]=b; idx[k++]=c; idx[k++]=d; }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos,3));
  g.setIndex(new THREE.BufferAttribute(idx,1)); g.computeVertexNormals();
  nearMesh = new THREE.Mesh(g, nearMat); nearMesh.receiveShadow = true; nearMesh.castShadow = true;
  scene.add(nearMesh);
}

// ---------- mid / far terrain (aerial photo drape, haze by fog) ----------
function buildGrid(G, texture, sinkInside, sinkDepth, lowerCb){
  const n=G.n; const pos=new Float32Array(n*n*3), uv=new Float32Array(n*n*2); let k=0, u=0;
  for (let j=0;j<n;j++) for (let i=0;i<n;i++){ const x=-G.ext+i*G.res, z=-G.ext+j*G.res;
    let h = G.v[j*n+i]*0.1;
    if (sinkInside(x,z)) h -= sinkDepth;
    if (h < -0.5 && !sinkInside(x,z)) h = -0.5;
    pos[k++]=x; pos[k++]=h; pos[k++]=z; uv[u++]=i/(n-1); uv[u++]=j/(n-1); }
  const idx=new Uint32Array((n-1)*(n-1)*6); k=0;
  for (let j=0;j<n-1;j++) for (let i=0;i<n-1;i++){ const a=j*n+i,b=a+1,c=a+n,d=c+1; idx[k++]=a;idx[k++]=c;idx[k++]=b;idx[k++]=b;idx[k++]=c;idx[k++]=d; }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  g.setIndex(new THREE.BufferAttribute(idx,1)); g.computeVertexNormals();
  const m=new THREE.MeshLambertMaterial({map:texture, color:0xd8e0d0});
  const mesh=new THREE.Mesh(g,m); mesh.receiveShadow=false; scene.add(mesh); return mesh;
}
const midMesh = buildGrid(MID, tMid, (x,z)=>inNear(x,z,1), 60);
const farMesh = buildGrid(FAR, tFar, (x,z)=>Math.abs(x)<MID.ext-10 && Math.abs(z)<MID.ext-10, 400);

// ---------- water ----------
const waterMats = [];
for (const p of F.ponds){
  const w=p.x1-p.x0, d=p.z1-p.z0; const g=new THREE.PlaneGeometry(w,d,1,1); g.rotateX(-Math.PI/2);
  const m=new THREE.MeshStandardMaterial({color:0x2a4a3c, roughness:0.06, metalness:0.0, envMapIntensity:1.0, transparent:true, opacity:0.93});
  m.onBeforeCompile = sh => { sh.uniforms.tM2={value:tM2};
    sh.vertexShader = sh.vertexShader.replace('#include <common>','#include <common>\nvarying vec3 vWP;').replace('#include <worldpos_vertex>','#include <worldpos_vertex>\nvWP=(modelMatrix*vec4(transformed,1.0)).xyz;');
    sh.fragmentShader = sh.fragmentShader.replace('#include <common>','#include <common>\nvarying vec3 vWP; uniform sampler2D tM2;')
      .replace('#include <map_fragment>', `#include <map_fragment>
        vec2 wuv=(vWP.xz-vec2(${N.x0.toFixed(1)},${N.z0.toFixed(1)})+0.5)/vec2(${NX}.0,${NZ}.0);
        if (texture2D(tM2,wuv).r < 0.5) discard;`); };
  waterMats.push(m);
  const mesh=new THREE.Mesh(g,m); mesh.position.set((p.x0+p.x1)/2, p.level, (p.z0+p.z1)/2); mesh.receiveShadow=true; scene.add(mesh);
}

// ---------- course objects ----------

function mulberry(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function leafTexture(seed, hueA, hueB, needle){
  const cv=document.createElement('canvas'); cv.width=cv.height=256; const c=cv.getContext('2d'); const r=mulberry(seed);
  const n = needle? 900 : 420;

    // leaves fill a soft round clump; inner leaves darker (self-shadowing)
    const rad=Math.sqrt(r())*112, th=r()*Math.PI*2; const x=128+Math.cos(th)*rad, y=128+Math.sin(th)*rad*0.9;
    const a=r()*Math.PI*2, l=needle? 7+r()*9 : 7+r()*8, w=needle? 0.9 : 3.5+r()*2.5;
    const edge=rad/112; const h=hueA+(hueB-hueA)*r(), s=38+r()*25, v=14+edge*22+r()*14;
    c.save(); c.translate(x,y); c.rotate(a); c.fillStyle=`hsl(${h},${s}%,${v}%)`;
    c.beginPath(); c.ellipse(0,0,l,w,0,0,Math.PI*2); c.fill(); c.restore();
  }

}

      for (let j=0;j<7;j++){ const a=r()*Math.PI*2, rr=rad*(0.5+0.5*r()); card(Math.cos(a)*rr, cy+(r()-0.5)*0.04, Math.sin(a)*rr, 0.10+0.12*(1-t), 0,cy,0, true); } }

for (const k of teeOrder){ const o=document.createElement('option'); o.value=k; o.textContent=`${k}（${D.info.yards[k]}Y）`; $('teeSel').appendChild(o); }
function viewTee(){ const t=F.tees[$('teeSel').value]; const aim=pointAt(Math.min(total, 245*YD));
  const p=eyeAt(t.x,t.z,1.6); const q=eyeAt(aim.x,aim.y,1.0); const dir=q.clone().sub(p).normalize();
  setView(p, p.clone().addScaledVector(dir, 3)); camera.fov=50; camera.updateProjectionMatrix(); }
function viewTop(){ const c=cl[0].clone().add(cl[cl.length-1]).multiplyScalar(0.5); const h=hAt(c.x,c.y);
  const d=new THREE.Vector2().subVectors(cl[cl.length-1], cl[0]).normalize();
  setView(new THREE.Vector3(c.x-d.x*0.5, h+640, c.y-d.y*0.5), new THREE.Vector3(c.x, h, c.y)); }
function viewBack(){ const a=pointAt(total-60), g=cl[cl.length-1]; const d=new THREE.Vector2().subVectors(g,a).normalize();
  const px=pin.x+d.x*16, pz=pin.z+d.y*16; const p=eyeAt(px,pz,3.0);
  const aim=pointAt(total-230); setView(p, eyeAt(aim.x,aim.y,2)); }
function viewFly(){
  const pts=[]; const n=24;
  for (let i=0;i<=n;i++){ const d=total*i/n; const p=pointAt(d); const t=i/n;
    const alt= t<0.08 ? 1.7+ (t/0.08)*6 : t<0.85 ? 8+Math.sin((t-0.08)/0.77*Math.PI)*32 : 8-(t-0.85)/0.15*5.5;
    pts.push(new THREE.Vector3(p.x, hAt(p.x,p.y)+alt, p.y)); }
  const t0=F.tees.FULL; pts[0]=eyeAt(t0.x,t0.z,1.7);
  const curve=new THREE.CatmullRomCurve3(pts, false, 'centripetal');
  fly={curve, t0:performance.now(), dur:15000}; controls.enabled=false;
}
$('vTee').onclick=()=>{stopFree(); viewTee();}; $('vTop').onclick=()=>{stopFree(); viewTop();}; $('vBack').onclick=()=>{stopFree(); viewBack();}; $('vFly').onclick=()=>{stopFree(); viewFly();};

// ---------- free flight (drone-style) ----------
const free = { on:false, yaw:0, pitch:0, vel:new THREE.Vector3(), speed:15, keys:{}, joy:[0,0], up:0, drag:null };
const FREE_LIMIT = MID.ext - 300;      // stay inside the detailed terrain
function startFree(){
  fly=null; free.on=true; controls.enabled=false;
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  const d=new THREE.Vector3(); camera.getWorldDirection(d);
  free.yaw=Math.atan2(d.x, -d.z); free.pitch=Math.asin(Math.max(-0.99, Math.min(0.99, d.y)));
  free.vel.set(0,0,0); camera.fov=60; camera.updateProjectionMatrix();
  $('vFree').classList.add('on'); $('vFree').textContent='⑤ 自由飛行モード：ON';
  $('flyHud').style.display='block';
  $('joy').style.display = 'block'; $('flyBtns').style.display = 'flex';
}
function stopFree(){
  if (!free.on) return; free.on=false;
  const d=new THREE.Vector3(); camera.getWorldDirection(d);
  controls.target.copy(camera.position).addScaledVector(d, 40); controls.enabled=true; controls.update();
  $('vFree').classList.remove('on'); $('vFree').textContent='⑤ 自由飛行モード：OFF';
  $('flyHud').style.display='none'; $('joy').style.display='none'; $('flyBtns').style.display='none';
  free.keys={}; free.joy=[0,0]; free.up=0;
}
$('vFree').onclick=()=>{ if (free.on) stopFree(); else startFree(); };
const typing = e => { const a=document.activeElement; return !!a && (a.tagName==='TEXTAREA' || (a.tagName==='INPUT' && ['text','search','number','email'].includes(a.type))); };
window.addEventListener('keydown', e=>{ if (!free.on || typing(e)) return;
  if (e.code==='Escape'){ stopFree(); return; }
  free.keys[e.code]=true; if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter'].includes(e.code)) e.preventDefault(); }, true);
window.addEventListener('keyup', e=>{ free.keys[e.code]=false; if (free.on && ['Space','Enter'].includes(e.code)) e.preventDefault(); }, true);
window.addEventListener('blur', ()=>{ free.keys={}; });
canvas.addEventListener('wheel', e=>{ if (!free.on) return; e.preventDefault();
  free.speed=Math.max(2, Math.min(120, free.speed*(e.deltaY<0?1.15:1/1.15))); }, {passive:false});
canvas.addEventListener('pointerdown', e=>{ if (!free.on) return; if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); free.drag={id:e.pointerId, x:e.clientX, y:e.clientY}; canvas.setPointerCapture(e.pointerId); });
canvas.addEventListener('pointermove', e=>{ if (!free.on || !free.drag || free.drag.id!==e.pointerId) return;
  const k = e.pointerType==='touch' ? 0.005 : 0.0035;
  free.yaw += (e.clientX-free.drag.x)*k; free.pitch -= (e.clientY-free.drag.y)*k;
  free.pitch=Math.max(-1.45, Math.min(1.2, free.pitch)); free.drag.x=e.clientX; free.drag.y=e.clientY; });
canvas.addEventListener('pointerup', e=>{ if (free.drag && free.drag.id===e.pointerId) free.drag=null; });
// touch joystick
{ const joy=$('joy'), knob=$('joyKnob'); let jid=null;
  const setJ=(e)=>{ const r=joy.getBoundingClientRect(); let dx=(e.clientX-r.left-r.width/2)/(r.width/2), dy=(e.clientY-r.top-r.height/2)/(r.height/2);
    const l=Math.hypot(dx,dy); if (l>1){ dx/=l; dy/=l; } free.joy=[dx,-dy]; knob.style.left=(40+dx*40)+'px'; knob.style.top=(40+dy*40)+'px'; };
  joy.addEventListener('pointerdown', e=>{ jid=e.pointerId; joy.setPointerCapture(jid); setJ(e); e.stopPropagation(); });
  joy.addEventListener('pointermove', e=>{ if (e.pointerId===jid) setJ(e); });
  const end=e=>{ if (e.pointerId!==jid) return; jid=null; free.joy=[0,0]; knob.style.left='40px'; knob.style.top='40px'; };
  joy.addEventListener('pointerup', end); joy.addEventListener('pointercancel', end);
  for (const [id,v] of [['flyUp',1],['flyDown',-1]]){ const b=$(id);
    b.addEventListener('pointerdown', e=>{ free.up=v; e.preventDefault(); }); for (const ev of ['pointerup','pointerleave','pointercancel']) b.addEventListener(ev, ()=>{ free.up=0; }); }
}
function updateFree(dt){
  const K=free.keys;
  let f=(K.KeyW||K.ArrowUp?1:0)-(K.KeyS||K.ArrowDown?1:0)+free.joy[1];
  let r=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0)+free.joy[0];
  const shift=K.ShiftLeft||K.ShiftRight;
  let u=((K.Space&&!shift)||K.KeyE?1:0)-((K.Space&&shift)||K.KeyQ?1:0)+free.up;
  const sp=free.speed*(shift&&!K.Space?2.5:1);
  const fwd=new THREE.Vector3(Math.sin(free.yaw)*Math.cos(free.pitch), Math.sin(free.pitch), -Math.cos(free.yaw)*Math.cos(free.pitch));
  const right=new THREE.Vector3(Math.cos(free.yaw), 0, Math.sin(free.yaw));
  const want=new THREE.Vector3().addScaledVector(fwd,f).addScaledVector(right,r).addScaledVector(new THREE.Vector3(0,1,0),u);
  if (want.lengthSq()>1) want.normalize(); want.multiplyScalar(sp);
  free.vel.lerp(want, 1-Math.exp(-dt*4));                 // smooth acceleration / braking like a drone
  camera.position.addScaledVector(free.vel, dt);
  camera.position.x=Math.max(-FREE_LIMIT, Math.min(FREE_LIMIT, camera.position.x));
  camera.position.z=Math.max(-FREE_LIMIT, Math.min(FREE_LIMIT, camera.position.z));
  const g=hAt(camera.position.x, camera.position.z);
  if (camera.position.y < g+1.5){ camera.position.y=g+1.5; if (free.vel.y<0) free.vel.y=0; }   // never go below the ground
  if (camera.position.y > g+600) camera.position.y=g+600;
  camera.lookAt(camera.position.clone().add(fwd));
  const dp=Math.hypot(pin.x-camera.position.x, pin.z-camera.position.z);
  $('flyInfo').innerHTML=`高度（地面から）<b>${(camera.position.y-g).toFixed(1)} m</b>　速さ <b>${(free.vel.length()*3.6).toFixed(0)} km/h</b>（設定 ${(free.speed*3.6).toFixed(0)}）　ピンまで <b>${Math.round(dp/YD)} Y</b>`;
}
$('teeSel').onchange=viewTee;

// ---------- toggles / quality / time ----------
$('tTees').onchange=e=>teeGroup.visible=e.target.checked;
$('tYards').onchange=e=>yardGroup.visible=e.target.checked;
$('tInfo').onchange=e=>$('info').style.display=e.target.checked?'block':'none';
$('tAer').onchange=e=>uniforms.uAer.value=e.target.checked?0.85:0;
const Q={ high:{step:1, shadow:4096, pr:2, trees:1}, std:{step:2, shadow:2048, pr:1.5, trees:1}, low:{step:4, shadow:1024, pr:1, trees:0.4} };
function setQuality(q){ const c=Q[q]; buildNear(c.step); setTreeDensity(c.trees);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, c.pr));
  if (sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map=null; } sun.shadow.mapSize.set(c.shadow,c.shadow);
  resize(); }
$('quality').onchange=e=>setQuality(e.target.value);
$('time').oninput=e=>setTime(parseFloat(e.target.value));

function resize(){ const w=window.innerWidth, h=window.innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); }
window.addEventListener('resize', resize);

// ---------- loop ----------
let frames=0, lastT=performance.now();
let lastFrame=performance.now();
function animate(now){
  const dtF=Math.min(0.25,(now-lastFrame)/1000); lastFrame=now;
  requestAnimationFrame(animate);
  if (free.on){ updateFree(dtF); }
  else if (fly){ const t=Math.min(1,(now-fly.t0)/fly.dur); const e=t<0.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
    const p=fly.curve.getPointAt(e); const q=fly.curve.getPointAt(Math.min(1,e+0.06));
    if (e>0.94){ q.set(pin.x, pinH+1.0, pin.z); }
    camera.position.copy(p); camera.lookAt(q);
    if (t>=1){ controls.target.set(pin.x, pinH, pin.z); fly=null; controls.enabled=true; controls.update(); }
  } else controls.update();
  // flag waving
  const a=flagGeo.attributes.position; const ph=now*0.004;
  for (let i=0;i<a.count;i++){ const x=flagBase[i*3]; a.array[i*3+2]=Math.sin(x*9-ph)*0.05*x*2; } a.needsUpdate=true;
  scaleMarkers();
  clouds.position.copy(camera.position);
  renderer.render(scene, camera);
  frames++; if (now-lastT>1000){ $('fps').textContent=`${Math.round(frames*1000/(now-lastT))} fps`; frames=0; lastT=now; }
}
setQuality('std'); setTime(10); viewTee();
$('loading').style.display='none';
window.__ready = true;
window.__hAt = hAt;
window.__free = {free, updateFree};
window.__views = {startFree, stopFree, viewTee, viewTop, viewBack, viewFly, setQuality};
window.__dbg = {clouds, treeMeshes, THREE, scene, renderer, sky, sun, hemi, uniforms, nearMat, midMesh, farMesh, camera, controls};
requestAnimationFrame(animate);
</script>
